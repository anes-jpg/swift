<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 360px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #111;
        color: #e8e8e8;
        font-size: 13px;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        background: rgba(220, 38, 38, 0.06);
        border-bottom: 1px solid rgba(255,255,255,0.05);
      }
      .logo { width: 26px; height: 26px; flex-shrink: 0; }
      .header-text { flex: 1; }
      .header-text h1 { font-size: 14px; font-weight: 700; }
      .header-text .sub { font-size: 11px; color: rgba(255,255,255,0.3); }
      .count-badge {
        background: rgba(220, 38, 38, 0.15);
        color: #ef4444;
        padding: 2px 8px;
        border-radius: 10px;
        font-size: 11px;
        font-weight: 600;
      }
      .body { max-height: 360px; overflow-y: auto; }
      .body::-webkit-scrollbar { width: 4px; }
      .body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
      .empty {
        padding: 40px 16px;
        text-align: center;
        color: rgba(255,255,255,0.2);
        font-size: 13px;
      }
      .item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-bottom: 1px solid rgba(255,255,255,0.03);
        transition: background 0.1s;
      }
      .item:last-child { border-bottom: none; }
      .item:hover { background: rgba(255,255,255,0.03); }
      .fmt {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 6px;
        padding: 3px 8px;
        font-size: 11px;
        font-weight: 600;
        min-width: 44px;
        text-align: center;
        text-transform: uppercase;
        flex-shrink: 0;
      }
      .details { flex: 1; min-width: 0; }
      .quality { font-size: 13px; font-weight: 500; }
      .meta { font-size: 11px; color: rgba(255,255,255,0.25); margin-top: 1px; }
      .dl-btn {
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 8px;
        color: rgba(255,255,255,0.4);
        cursor: pointer;
        transition: all 0.15s;
        flex-shrink: 0;
      }
      .dl-btn:hover { background: #dc2626; border-color: #dc2626; color: white; }
      .dl-btn:active { transform: scale(0.9); }
      .footer {
        padding: 8px 14px;
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        justify-content: flex-end;
      }
      .clear {
        background: none;
        border: none;
        color: rgba(255,255,255,0.2);
        font-size: 11px;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 4px;
      }
      .clear:hover { background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.5); }
    </style>
  </head>
  <body>
    <div class="header">
      <img class="logo" src="swift.png" width="28" height="28" style="border-radius:6px;" />
      <div class="header-text">
        <h1>Swift</h1>
        <div class="sub">Media on this page</div>
      </div>
      <span class="count-badge" id="count">0</span>
    </div>
    <div class="body" id="list"><div class="empty">No media detected</div></div>
    <div class="footer"><button class="clear" id="clear">Clear</button></div>
    <script src="popup.js"></script>
  </body>
</html>
